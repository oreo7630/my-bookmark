<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 프로젝트 마스터 | 북마크 대시보드</title>
<meta name="description" content="AI 프로젝트 마스터 수업용 북마크 대시보드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-brand">
      <strong>AI 프로젝트 마스터</strong>
      <span>수업용 북마크 대시보드</span>
    </div>
    <div class="topbar-actions">
      <input id="search-input" class="search-input" type="search" placeholder="사이트 이름, 설명으로 검색...">
      <button id="open-add-dialog" class="btn-primary" type="button">+ 사이트 추가</button>
    </div>
  </div>
</header>

<div class="app-body">

  <nav class="sidebar" aria-label="카테고리">
    <div id="category-nav" class="category-nav" role="tablist"></div>
  </nav>

  <main class="main-content">

    <section id="favorites-section" class="section" hidden aria-labelledby="favorites-heading">
      <div class="section-head">
        <h2 id="favorites-heading">즐겨찾기</h2>
        <span id="favorites-count-text" class="count-text"></span>
      </div>
      <div id="favorites-grid" class="card-grid"></div>
    </section>

    <section id="recent-section" class="section" hidden aria-labelledby="recent-heading">
      <div class="section-head">
        <h2 id="recent-heading">최근 방문</h2>
      </div>
      <div id="recent-grid" class="card-grid"></div>
    </section>

    <section class="section" aria-labelledby="grid-heading">
      <div class="section-head">
        <h2 id="grid-heading"><span id="selected-tab-label">전체</span></h2>
        <span id="count-text" class="count-text"></span>
      </div>
      <div id="card-grid" class="card-grid"></div>
    </section>

  </main>

</div>

<dialog id="add-site-dialog" class="add-dialog">
  <form id="add-site-form" class="add-form">
    <h3>새 사이트 추가</h3>

    <label class="field">
      <span>카테고리</span>
      <select id="site-category" required></select>
    </label>

    <label class="field">
      <span>사이트 이름</span>
      <input id="site-name" type="text" placeholder="예: Notion" required>
    </label>

    <label class="field">
      <span>한 줄 설명</span>
      <input id="site-desc" type="text" placeholder="예: 팀 협업 및 문서 관리 도구">
    </label>

    <label class="field">
      <span>URL</span>
      <input id="site-url" type="text" placeholder="예: https://notion.so" required>
    </label>

    <div class="dialog-actions">
      <button type="button" id="cancel-add-dialog" class="btn-secondary">취소</button>
      <button type="submit" class="btn-primary">추가</button>
    </div>
  </form>
</dialog>

<footer class="bottombar">
  <button id="theme-toggle" class="bottombar-btn" type="button" aria-label="다크모드 전환">
    <span class="bottombar-icon" aria-hidden="true">&#9680;</span><span>다크모드</span>
  </button>
  <button id="backup-btn" class="bottombar-btn" type="button">
    <span class="bottombar-icon" aria-hidden="true">&#11015;</span><span>백업</span>
  </button>
  <button id="restore-btn" class="bottombar-btn" type="button">
    <span class="bottombar-icon" aria-hidden="true">&#11014;</span><span>복원</span>
  </button>
  <input id="restore-file-input" type="file" accept="application/json" hidden>
  <button id="back-to-top" class="bottombar-btn" type="button">
    <span class="bottombar-icon" aria-hidden="true">&#8593;</span><span>맨 위로</span>
  </button>
</footer>

<script src="script.js"></script>
</body>
</html>
